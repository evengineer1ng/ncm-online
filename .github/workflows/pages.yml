# Build the NCM Online website (site/) and publish it to GitHub Pages.
#
# Independent of the game's own gate (tools/ncm-test.ps1): a docs failure never blocks server work, and server work
# never needs this workflow. Pull requests build and check only; pushes to main also deploy.
name: Website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "ncm/core/player/help.lua"
      - "ncm/online/resources/ncm_world/client/landing_content.lua"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "ncm/core/player/help.lua"
      - "ncm/online/resources/ncm_world/client/landing_content.lua"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the one dependency (pinned)
        run: python -m pip install --disable-pip-version-check -r site/requirements.txt
      - name: Build and check links and paths
        run: python site/build.py --check
      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
