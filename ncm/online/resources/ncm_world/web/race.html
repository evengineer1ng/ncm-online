<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NCM Race HUD</title>
  <style>
    :root {
      --panel: rgba(10, 18, 32, 0.94);
      --line: rgba(174, 211, 224, 0.30);
      --text: #f2f6f8;
      --dim: #8d99a8;
      --accent: #22d8e2;
      --red: #ff2a3c;
      --red-glow: rgba(255, 42, 60, 0.75);
      --ok: #4fe3a9;
      --warn: #f5c95c;
      /* The ghost's own colour, distinct from every state colour on this HUD so a ghost row can never be
         mistaken for a flag, a penalty or a result. */
      --ghost: #9aa8ff;
      --display: "Rajdhani", "Bahnschrift Condensed", "Bahnschrift SemiCondensed", "Arial Narrow", "Segoe UI", sans-serif;
      --mono: "IBM Plex Mono", "Cascadia Mono", "Consolas", ui-monospace, monospace;
    }
    html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; pointer-events: none; font-family: var(--display); color: var(--text); }
    .hidden { display: none !important; }
    .ncm-glyph { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
    .ncm-glyph .accent { stroke: var(--glyph-accent, var(--accent)); }
    .ncm-glyph .fill { fill: currentColor; stroke: none; }

    /* Light tree: five red lamps in a dark gantry, top centre. */
    #tree { position: absolute; top: 64px; left: 50%; transform: translateX(-50%); display: flex; gap: 22px; padding: 22px 30px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
    .lamp { width: 92px; height: 92px; border-radius: 50%; background: #2a0d12; border: 3px solid #4a141c; box-shadow: inset 0 0 22px rgba(0,0,0,0.8); transition: background 60ms linear, box-shadow 60ms linear; }
    .lamp.on { background: var(--red); border-color: #ff6b78; box-shadow: 0 0 34px 10px var(--red-glow), inset 0 0 18px rgba(255,255,255,0.35); }
    #tree.out .lamp { background: #1a1014; border-color: #3a1a20; box-shadow: none; }

    /* Big centre banner: GO / FINISH / JUMP START / result. */
    #banner { position: absolute; top: 300px; left: 0; right: 0; text-align: center; font-weight: 800; font-size: 168px; line-height: 1; letter-spacing: 0.06em; text-transform: uppercase; text-shadow: 0 0 28px rgba(0,0,0,0.9), 0 4px 0 rgba(0,0,0,0.6); color: var(--text); }
    #banner.go { color: var(--ok); text-shadow: 0 0 60px rgba(79,227,169,0.9), 0 4px 0 rgba(0,0,0,0.6); }
    #banner.bad { color: var(--red); text-shadow: 0 0 60px var(--red-glow), 0 4px 0 rgba(0,0,0,0.6); }
    #banner.warn { color: var(--warn); }
    #banner .sub { display: block; font-size: 56px; font-weight: 600; letter-spacing: 0.08em; margin-top: 12px; color: var(--text); }
    #banner .ncm-glyph { display: block; width: 112px; height: 112px; margin: 0 auto 18px; }

    /* Race strip: top centre under the tree, or where the tree was. */
    #strip { position: absolute; top: 210px; left: 50%; transform: translateX(-50%); min-width: 720px; padding: 12px 26px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; display: flex; gap: 20px; align-items: center; justify-content: center; }
    #stripIcon { width: 30px; height: 30px; color: var(--accent); }
    #stripIcon .ncm-glyph { width: 30px; height: 30px; }
    #strip.noTree { top: 64px; }
    #strip .eyebrow { font: 700 16px/1 var(--mono); letter-spacing: 0.2em; color: var(--accent); text-transform: uppercase; }
    #strip .big { font-size: 54px; font-weight: 800; line-height: 1; letter-spacing: 0.04em; }
    #strip .mid { font-size: 30px; font-weight: 600; color: var(--text); }
    #strip .dim { font-size: 24px; font-weight: 600; color: var(--dim); }
    #strip.grid .eyebrow { color: var(--warn); }
    #strip.done .eyebrow { color: var(--ok); }

    /* Results board: every entrant, centre of the screen after the flag. */
    /* The ghost row. Sits ABOVE the board and is not a row in it: a ghost is a target, not an entrant, so it
       is never given a position and never counted in the field (L166). */
    #ghost { position: absolute; top: 286px; left: 50%; transform: translateX(-50%); min-width: 760px;
             background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--ghost);
             border-radius: 10px; padding: 7px 18px; display: flex; align-items: baseline; gap: 16px; }
    #ghost .lbl { font-size: 12px; letter-spacing: .14em; color: var(--ghost); text-transform: uppercase; }
    #ghost .who { font-size: 13px; opacity: .8; }
    #ghost .time { font-size: 17px; font-variant-numeric: tabular-nums; margin-left: auto; }
    /* Ahead and behind must be distinguishable at a glance and never by colour alone -- the sign carries it. */
    #ghost .delta { font-size: 17px; font-variant-numeric: tabular-nums; min-width: 86px; text-align: right; }
    #ghost .delta.ahead { color: var(--ok); }
    #ghost .delta.behind { color: var(--red); }
    #ghost .delta.na { opacity: .45; }
    #ghost .warn { font-size: 11px; letter-spacing: .1em; color: var(--warn); }
    #board { position: absolute; top: 340px; left: 50%; transform: translateX(-50%); min-width: 760px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 22px; }
    #board .title { display: flex; align-items: center; gap: 8px; font: 700 16px/1 var(--mono); letter-spacing: 0.2em; color: var(--ok); text-transform: uppercase; margin-bottom: 10px; }
    #board .title .ncm-glyph { width: 22px; height: 22px; }
    #board table { border-collapse: collapse; width: 100%; }
    #board td { padding: 6px 14px; font-size: 30px; font-weight: 600; line-height: 1.1; white-space: nowrap; }
    #board td.pos { font-size: 34px; font-weight: 800; color: var(--accent); width: 70px; }
    #board td.time { font-family: var(--mono); font-size: 26px; text-align: right; }
    #board td.gap { font-family: var(--mono); font-size: 22px; color: var(--dim); text-align: right; }
    #board tr.me td { color: var(--warn); }
    #board tr.me td.pos { color: var(--warn); }

    /* Driver's instrument cluster. Bottom LEFT, small and quiet: it must not touch the vanilla speedometer
       (bottom centre/right) and must not compete with the race strip (top centre). Persistent machine
       information, so it is visible in freeroam and during a race alike. */
    #instr { position: absolute; left: 44px; bottom: 184px; padding: 8px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; min-width: 152px; }
    #instr .who { font: 700 10px/1.2 var(--mono); letter-spacing: 0.14em; color: var(--dim); text-transform: uppercase; white-space: nowrap; }
    #instr .odo { font: 700 19px/1.1 var(--mono); letter-spacing: 0.03em; color: var(--text); margin-top: 3px; }
    #instr .odo small { font-size: 11px; color: var(--dim); letter-spacing: 0.14em; margin-right: 6px; }

    /* Driver inputs (IDEA-366). Directly ABOVE the odometer and the same width, so the two read as one
       cluster rather than two panels that happen to be near each other. Deliberately small and low-contrast:
       it is glanceable confirmation of what the hands and feet are doing, never something to look AT while
       driving. Three inputs only -- steering, throttle, brake. */
    #inputs { position: absolute; left: 44px; bottom: 252px; padding: 8px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; min-width: 152px; box-sizing: border-box; display: flex; align-items: flex-end; gap: 12px; }
    #inputs .wheel { color: var(--dim); flex: 0 0 auto; }
    /* 80ms is just over one 20 Hz sample, so motion is continuous without lagging behind the hands. */
    #inputs .wheel g { transition: transform 80ms linear; transform-origin: 0 0; }
    #inputs .wheel.na { opacity: 0.28; }
    /* The km/h readout. Every number in NCM is km/h and the vanilla dial is mph, so without this the
       driver converts in their head on every run -- which is exactly where confidence leaks. Deliberately
       NOT a dial: the vanilla speedometer is still there and drawing a second one would be noise. */
    #inputs .spd { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; flex: 0 0 auto; min-width: 58px; }
    #inputs .spd .val { font: 700 22px/1 var(--mono); color: var(--fg); font-variant-numeric: tabular-nums; }
    #inputs .spd .val.na { color: var(--dim); opacity: 0.5; }
    #inputs .spd .unit { font: 600 9px/1 var(--mono); letter-spacing: .16em; color: var(--dim); }
    #inputs .peds { display: flex; gap: 8px; flex: 0 0 auto; }
    #inputs .ped { display: flex; flex-direction: column; align-items: center; gap: 3px; }
    #inputs .bar { position: relative; width: 10px; height: 38px; background: rgba(255,255,255,0.09); border-radius: 3px; overflow: hidden; }
    #inputs .bar i { position: absolute; left: 0; right: 0; bottom: 0; height: 0; display: block; transition: height 80ms linear; }
    #inputs .bar.t i { background: var(--ok); }
    #inputs .bar.b i { background: var(--red); }
    #inputs .ped b { font: 700 9px/1 var(--mono); letter-spacing: 0.12em; color: var(--dim); }
    #inputs .ped em { font: 700 10px/1 var(--mono); font-style: normal; color: var(--dim); }
    #inputs .na .bar i { background: var(--line) !important; }

    /* Tyre temperature (L159). A FOURTH FLEX ITEM inside #inputs rather than a panel of its own: the
       bottom-left column is already #instr at 184px and #inputs at 252px, and #graph occupies the left
       edge from roughly 325px up. A separate box at 320px clears the graph on 1440p and OVERLAPS IT ON
       1080P, which is the more common resolution and not the one this was authored on.
       Riding inside #inputs also makes it read as one instrument cluster with the pedals, which is what
       "small and uninvasive near the odometer and inputs hud" asks for. */
    #inputs .tyre { display: flex; flex-direction: column; align-items: center; gap: 3px; }
    #inputs .tyre .col { position: relative; width: 10px; height: 38px; background: rgba(255,255,255,0.09); border-radius: 3px; overflow: hidden; }
    /* The WINDOW as a lit band rather than a line: it is a target to sit inside, so it needs width on the
       gauge as well as in the model. Its height is the same fraction of the scale the model calls "in". */
    #inputs .tyre .win { position: absolute; left: 0; right: 0; bottom: 40%; height: 20%; background: rgba(120,255,180,0.22); border-top: 1px solid rgba(120,255,180,0.45); border-bottom: 1px solid rgba(120,255,180,0.45); }
    /* 500ms matches the 2 Hz feed exactly, so the needle moves continuously instead of stepping. */
    #inputs .tyre .ndl { position: absolute; left: -2px; right: -2px; height: 2px; bottom: 50%; background: var(--text); border-radius: 1px; transition: bottom 500ms linear, background 500ms linear; }
    #inputs .tyre.cold .ndl { background: #7fc4ff; }
    #inputs .tyre.hot .ndl { background: var(--red); }
    #inputs .tyre.good .ndl { background: var(--ok); }
    /* Unknown draws NO NEEDLE AT ALL (IDEA-361). A needle resting mid-gauge is the most plausible-looking
       wrong value this design can produce: it reads as "your tyres are perfect" when the truth is "we have
       no idea". */
    #inputs .tyre.na .ndl { display: none; }
    #inputs .tyre.na .win { opacity: 0.25; }
    #inputs .tyre b { font: 700 9px/1 var(--mono); letter-spacing: 0.12em; color: var(--dim); }
    #inputs .tyre em { font: 700 10px/1 var(--mono); font-style: normal; color: var(--dim); }
    #inputs .tyre em.state { min-width:58px;text-align:center;color:var(--text);letter-spacing:.05em; }
    #wearLamps { position:absolute;left:0;bottom:calc(100% + 6px);display:flex;gap:5px;align-items:center;pointer-events:none; }
    #wearLamps.hidden { display:none; }
    #wearLamps .wear-lamp { min-width:22px;height:20px;padding:0 4px;border:1px solid var(--warn);border-radius:4px;background:rgba(8,10,13,.84);color:var(--warn);font:800 9px/20px var(--mono);letter-spacing:.05em;text-align:center;box-sizing:border-box; }
    #wearLamps .wear-lamp.critical { border-color:var(--red);background:var(--red);color:#fff; }

    /* Live race graph (P40). VERTICAL, and deliberately small.
       It used to be a 1240px bar across the bottom of the screen, which sat on top of the speedometer. It now
       stands on the RIGHT edge (owner, 2026-09-27, L180; it stood on the left until then), clear of the vanilla
       driving HUD (bottom-centre speed, bottom-right minimap) and clear of NCM's own strip/board/banner, all
       of which are top-centre. Finish at the top, start at the bottom, because that is the direction the race
       is going.

       The whole thing is MIRRORED rather than merely shifted: the line and the dots hug the box's right edge
       and every label reads LEFTWARD, inward across the screen. Labels are `white-space: nowrap` and overflow
       the 152px box on purpose, so a graph on the right with labels still reading rightward would push driver
       names off the edge of the screen. */
    #graph { position: absolute; right: 44px; top: 50%; transform: translateY(-50%); width: 152px; height: 430px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
    #graph .line { position: absolute; right: 34px; top: 46px; bottom: 40px; width: 3px; background: var(--line); border-radius: 2px; }
    #graph .flag { position: absolute; left: 0; right: 0; top: 14px; display: flex; align-items: center; justify-content: center; gap: 5px; font: 700 11px/1 var(--mono); letter-spacing: 0.16em; color: var(--ok); }
    #graph .flag .ncm-glyph { width: 14px; height: 14px; }
    #graph .lbl { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; font: 700 11px/1 var(--mono); letter-spacing: 0.16em; color: var(--dim); }
    /* A dot sits on the line at its progress; its label reads inward to the LEFT, so several close together
       stay legible instead of stacking on top of each other, and none of them leaves the screen. */
    #graph .dot { position: absolute; right: 35px; width: 16px; height: 16px; margin-right: -8px; margin-top: -8px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.85); box-shadow: 0 0 8px rgba(0,0,0,0.8); transition: top 300ms linear; }
    #graph .dot .tag { position: absolute; right: 22px; top: 50%; transform: translateY(-50%); text-align: right; font: 700 12px/1 var(--mono); letter-spacing: 0.06em; color: var(--text); white-space: nowrap; text-shadow: 0 0 6px rgba(0,0,0,0.9); }
    #graph .dot.me { width: 22px; height: 22px; margin-right: -11px; margin-top: -11px; border-color: var(--warn); box-shadow: 0 0 14px rgba(245,201,92,0.9); z-index: 2; }
    #graph .dot.me .tag { color: var(--warn); }
    #graph .dot .inc { position: absolute; right: 22px; top: 14px; text-align: right; font: 700 10px/1 var(--mono); color: var(--red); white-space: nowrap; }
  </style>
</head>
<body>
  <div id="tree" class="hidden">
    <div class="lamp"></div><div class="lamp"></div><div class="lamp"></div><div class="lamp"></div><div class="lamp"></div>
  </div>
  <div id="strip" class="hidden">
    <span id="stripIcon"></span>
    <span class="eyebrow" id="eyebrow"></span>
    <span class="big" id="big"></span>
    <span class="mid" id="mid"></span>
    <span class="dim" id="dim"></span>
  </div>
  <div id="banner" class="hidden"></div>
  <div id="ghost" class="hidden"><span class="lbl" id="ghostLabel"></span><span class="who" id="ghostWho"></span><span class="time" id="ghostTime"></span><span class="delta na" id="ghostDelta">--</span><span class="warn hidden" id="ghostWarn"></span></div>
  <div id="board" class="hidden"><div class="title"><span id="boardIcon"></span><span id="boardTitle"></span></div><table><tbody id="rows"></tbody></table></div>
  <div id="inputs" class="hidden">
    <div id="wearLamps" class="hidden" aria-label="Component condition warnings"></div>
    <div class="wheel" id="inWheel"><svg viewBox="-24 -24 48 48" width="40" height="40" aria-hidden="true"><g id="inWheelG"><circle r="20" fill="none" stroke="currentColor" stroke-width="3.2"/><line x1="-19.5" y1="-3" x2="19.5" y2="-3" stroke="currentColor" stroke-width="2.8"/><line x1="0" y1="-3" x2="0" y2="19.5" stroke="currentColor" stroke-width="2.8"/><circle r="3.2" fill="currentColor"/></g></svg></div>
    <!-- km/h, because every number NCM composes is km/h and the vanilla dial is mph. -->
    <div class="spd"><span class="val na" id="inSpd">--</span><span class="unit">KM/H</span></div>
    <div class="peds">
      <!-- Brake LEFT of throttle: pedal-box order, so the panel reads the way the feet are arranged
           (owner QA, 2026-09-24). -->
      <div class="ped" id="inBrkPed"><div class="bar b"><i id="inBrk"></i></div><b>BRK</b><em id="inBrkPct">--</em></div>
      <div class="ped" id="inThrPed"><div class="bar t"><i id="inThr"></i></div><b>THR</b><em id="inThrPct">--</em></div>
    </div>
    <div class="tyre na" id="inTyre"><div class="col"><div class="win"></div><div class="ndl" id="inTyreNdl"></div></div><b>TYRE</b><em class="state" id="inTyreState">UNKNOWN</em><em id="inTyrePct">--</em></div>
  </div>
  <div id="instr" class="hidden"><div class="who" id="instrWho"></div><div class="odo" id="instrOdo"></div></div>
  <div id="graph" class="hidden"><span class="flag" id="graphFlag"></span><div class="line"></div><div id="dots"></div><span class="lbl">START</span></div>
  <script src="glyphs.js"></script>
  <script>
    (() => {
      "use strict";
      const tree = document.getElementById("tree");
      const lamps = Array.from(tree.querySelectorAll(".lamp"));
      const strip = document.getElementById("strip");
      const stripIcon = document.getElementById("stripIcon");
      const eyebrow = document.getElementById("eyebrow");
      const big = document.getElementById("big");
      const mid = document.getElementById("mid");
      const dim = document.getElementById("dim");
      const banner = document.getElementById("banner");
      const board = document.getElementById("board");
      const boardTitle = document.getElementById("boardTitle");
      const rows = document.getElementById("rows");
      const instr = document.getElementById("instr");
      const instrWho = document.getElementById("instrWho");
      const instrOdo = document.getElementById("instrOdo");
      const wearLamps = document.getElementById("wearLamps");
      const graph = document.getElementById("graph");
      const graphFlag = document.getElementById("graphFlag");
      const dots = document.getElementById("dots");
      const dotEls = new Map();
      let boardKey = "";
      const text = (el, v) => { const s = String(v == null ? "" : v); if (el.textContent !== s) el.textContent = s; };
      const setGlyph = (el, name) => { const key = name || ""; if (el.dataset.glyph === key) return; el.dataset.glyph = key; if (key) el.replaceChildren(NcmGlyph.create(key)); else el.replaceChildren(); };
      const stripGlyph = (s) => {
        const words = ((s.kind || "") + " " + (s.eyebrow || "")).toLowerCase();
        if (words.includes("formation") || words.includes("grid")) return "formation";
        if (words.includes("practice")) return "practice";
        if (words.includes("incident")) return "incident";
        if (words.includes("finish") || words.includes("done") || words.includes("result")) return "finish";
        if (words.includes("time")) return "timer";
        return "circuit";
      };
      setGlyph(graphFlag, "finish"); graphFlag.append(document.createTextNode("FINISH"));

      function apply(s) {
        s = s || {};
        // Tree: visible during countdown and for a moment after lights-out.
        if (s.tree) {
          tree.classList.remove("hidden");
          tree.classList.toggle("out", s.lights === 0 && s.out === true);
          lamps.forEach((l, i) => l.classList.toggle("on", i < (s.lights || 0)));
        } else {
          tree.classList.add("hidden");
        }
        // Strip
        if (s.strip) {
          strip.classList.remove("hidden");
          strip.classList.toggle("noTree", !s.tree);
          strip.className = "" + (s.tree ? "" : "noTree ") + (s.strip.kind || "");
          setGlyph(stripIcon, stripGlyph(s.strip));
          text(eyebrow, s.strip.eyebrow); text(big, s.strip.big); text(mid, s.strip.mid); text(dim, s.strip.dim);
        } else {
          strip.classList.add("hidden");
        }
        // Board
        if (s.board && Array.isArray(s.board.rows) && s.board.rows.length) {
          const key = JSON.stringify(s.board);
          if (key !== boardKey) {
            boardKey = key;
            text(boardTitle, s.board.title || "RESULT");
            setGlyph(document.getElementById("boardIcon"), "completed");
            rows.innerHTML = "";
            for (const r of s.board.rows) {
              const tr = document.createElement("tr");
              if (r.me) tr.className = "me";
              for (const [cls, v] of [["pos", "P" + r.pos], ["name", r.name], ["time", r.time], ["gap", r.gap || ""]]) {
                const td = document.createElement("td"); td.className = cls; td.textContent = String(v == null ? "" : v); tr.append(td);
              }
              rows.append(tr);
            }
          }
          board.classList.remove("hidden");
        } else {
          boardKey = "";
          board.classList.add("hidden");
        }
        // Instrument cluster: this machine, and how far it has been. Shown whenever the driver is in an
        // identified NCM asset, race or no race.
        if (s.instrument && s.instrument.odo) {
          instr.classList.remove("hidden");
          const who = [s.instrument.serial, s.instrument.name].filter(Boolean).join("  ");
          text(instrWho, who || "NCM MACHINE");
          instrOdo.innerHTML = "";
          const lab = document.createElement("small"); lab.textContent = "ODO";
          instrOdo.append(lab, document.createTextNode(String(s.instrument.odo)));
        } else {
          instr.classList.add("hidden");
        }
        // Graph: dots move UP the line as progress increases. The server sends at most four drivers
        // (session.standings picks them), so nothing here caps or filters -- it only draws what it was given
        // and never invents a row to fill the strip.
        if (s.graph && s.graph.on && Array.isArray(s.graph.dots) && s.graph.dots.length) {
          graph.classList.remove("hidden");
          const seen = new Set();
          const top = 46, bottom = 430 - 40;            // the line's endpoints inside the panel
          const span = bottom - top;
          for (const d of s.graph.dots) {
            const key = (d.tag || "?") + "|" + (d.number || "");
            seen.add(key);
            let el = dotEls.get(key);
            if (!el) {
              el = document.createElement("div"); el.className = "dot";
              const tag = document.createElement("span"); tag.className = "tag"; el.append(tag);
              const inc = document.createElement("span"); inc.className = "inc"; el.append(inc);
              dots.append(el); dotEls.set(key, el);
            }
            // 0 progress is the bottom of the strip, 1 is the finish at the top.
            el.style.top = (bottom - span * Math.max(0, Math.min(1, d.frac || 0))) + "px";
            el.style.background = d.colour || "#22d8e2";
            el.classList.toggle("me", !!d.me);
            const label = (d.pos ? "P" + d.pos + " " : "") + (d.number ? "#" + d.number + " " : "") + (d.tag || "");
            text(el.querySelector(".tag"), label);
            // An incident already costs corrected progress, so the dot has moved; this names the cost.
            text(el.querySelector(".inc"), d.inc > 0 ? "+" + Math.round(d.inc) + "s" : "");
          }
          for (const [key, el] of dotEls) { if (!seen.has(key)) { el.remove(); dotEls.delete(key); } }
        } else {
          graph.classList.add("hidden");
        }
        // Banner
        if (s.banner && s.banner.text) {
          banner.classList.remove("hidden");
          banner.className = s.banner.kind || "";
          banner.innerHTML = "";
          const bannerWords = (String(s.banner.text) + " " + String(s.banner.kind || "")).toLowerCase();
          banner.append(NcmGlyph.create(bannerWords.includes("finish") || bannerWords.includes("complete") ? "finish" : (bannerWords.includes("jump") || bannerWords.includes("incident") || bannerWords.includes("penalty") ? "incident" : "live")));
          banner.append(document.createTextNode(String(s.banner.text)));
          if (s.banner.sub) { const sub = document.createElement("span"); sub.className = "sub"; sub.textContent = String(s.banner.sub); banner.append(sub); }
        } else {
          banner.classList.add("hidden");
        }
      }

      // Driver inputs arrive on their own channel at 20 Hz, deliberately NOT inside `race:state`: that
      // payload is diffed and republished on race events, and folding a continuously changing value into it
      // would defeat its own throttling. `off` (or an absent field) means "not read", and renders as a dash
      // rather than as a resting pedal -- a confidently wrong instrument is worse than an absent one.
      const inputs = document.getElementById("inputs");
      const spdVal = document.getElementById("inSpd");
      const inWheel = document.getElementById("inWheel");
      const inWheelG = document.getElementById("inWheelG");
      const pedEls = {
        throttle: { ped: document.getElementById("inThrPed"), fill: document.getElementById("inThr"), pct: document.getElementById("inThrPct") },
        brake:    { ped: document.getElementById("inBrkPed"), fill: document.getElementById("inBrk"), pct: document.getElementById("inBrkPct") },
      };
      const setPedal = (el, v) => {
        const known = typeof v === "number" && isFinite(v);
        el.ped.classList.toggle("na", !known);
        const h = known ? Math.max(0, Math.min(1, v)) * 100 : 0;
        const css = h.toFixed(1) + "%";
        if (el.fill.style.height !== css) el.fill.style.height = css;
        text(el.pct, known ? Math.round(h) : "--");
      };
      // Inputs and tyre state arrive independently and either can be absent. The cluster shows if EITHER
      // is known -- hiding the whole box when inputs are unreadable would take the tyre gauge with it, and
      // tyre temperature is server-derived and available even when the client snapshot is not.
      let haveInputs = false, haveTyre = false;
      const showCluster = () => inputs.classList.toggle("hidden", !(haveInputs || haveTyre));

      Open77.on("race:inputs", (v) => {
        // **Unknown renders as a dash, never as zero** (`IDEA-361`). A stationary car and a car we cannot
        // read are different claims, and 0 km/h is a measurement.
        const setSpeed = (kph) => {
          const ok = typeof kph === "number" && isFinite(kph);
          spdVal.textContent = ok ? String(Math.round(kph)) : "--";
          spdVal.classList.toggle("na", !ok);
        };
        if (!v || v.off) {
          setSpeed(null);
          haveInputs = false;
          setPedal(pedEls.throttle, null);
          setPedal(pedEls.brake, null);
          inWheel.classList.add("na");
          showCluster();
          return;
        }
        haveInputs = true;
        showCluster();
        setSpeed(v.kph);
        setPedal(pedEls.throttle, v.throttle);
        setPedal(pedEls.brake, v.brake);
        // Full lock is drawn at LOCK_DEG. Started at 120 and came down to 90 on owner QA: driving a real rig
        // mapped to a controller axis, 120 swung visibly further than the hands did. One constant, so it is
        // trivial to re-tune against a physical wheel.
        const LOCK_DEG = 90;
        const st = typeof v.steering === "number" && isFinite(v.steering) ? v.steering : null;
        inWheel.classList.toggle("na", st === null);
        const deg = (st === null ? 0 : Math.max(-1, Math.min(1, st)) * LOCK_DEG).toFixed(1);
        const tf = "rotate(" + deg + "deg)";
        if (inWheelG.style.transform !== tf) inWheelG.style.transform = tf;
      });

      // Tyre temperature (L159). `p` is a POSITION in the window, -1 fully cold to +1 fully hot, NOT a
      // temperature: the gauge should not need re-scaling every time the model's constants are tuned, and
      // a driver reads "where am I" rather than "how many degrees".
      const tyre = document.getElementById("inTyre");
      const tyreNdl = document.getElementById("inTyreNdl");
      const tyreState = document.getElementById("inTyreState");
      const tyrePct = document.getElementById("inTyrePct");
      let lastTyreP = null;
      Open77.on("race:tyre", (v) => {
        const p = v && typeof v.p === "number" && isFinite(v.p) ? Math.max(-1, Math.min(1, v.p)) : null;
        haveTyre = p !== null;
        showCluster();
        tyre.classList.toggle("na", p === null);
        tyre.classList.toggle("cold", p !== null && p < -0.2);
        tyre.classList.toggle("hot", p !== null && p > 0.2);
        tyre.classList.toggle("good", p !== null && p >= -0.2 && p <= 0.2);
        if (p === null) { text(tyreState,"UNKNOWN");text(tyrePct, "--");lastTyreP=null;return; }
        const css = (((p + 1) / 2) * 100).toFixed(1) + "%";
        if (tyreNdl.style.bottom !== css) tyreNdl.style.bottom = css;
        const delta=lastTyreP===null?0:p-lastTyreP;
        const arrow=Math.abs(delta)<0.015?"":(delta>0?" ↑":" ↓");
        text(tyreState,(p < -0.2 ? "COLD" : (p > 0.2 ? "HOT" : "WINDOW"))+arrow);
        lastTyreP=p;
        // The grip multiplier as a percentage COST, because "you are giving up 6%" is the actionable
        // reading and "0.94" is not.
        const cost = typeof v.m === "number" && isFinite(v.m) ? Math.round((1 - v.m) * 100) : null;
        text(tyrePct, cost === null ? "--" : (cost === 0 ? "FULL GRIP" : "-" + cost + "% GRIP"));
      });

      const wearShort={service:"SRV",engine:"ENG",drivetrain:"DRV",brake:"BRK",tyre:"TYR",temperature:"TMP",electrical:"ELC",chassis:"CHS"};
      Open77.on("race:wear", (v) => {
        const warnings=v&&Array.isArray(v.warnings)?v.warnings:[];wearLamps.innerHTML="";
        for(const w of warnings){const lamp=document.createElement("span");lamp.className="wear-lamp "+(w.status==="critical"?"critical":"attention");lamp.textContent=wearShort[w.system]||"!";lamp.title=String(w.label||w.system||"Service required");lamp.setAttribute("aria-label",lamp.title);wearLamps.append(lamp);}
        wearLamps.classList.toggle("hidden",warnings.length===0);
      });

      // ---------------------------------------------------------------------------------------------
      // IDEA-387 probe: can this bundled page open a WebSocket to the player's own machine?
      // ---------------------------------------------------------------------------------------------
      //
      // The platform allows it (OPEN//77 resource-runtime, "Remote pages, external content and hot reload":
      // bundled and remote pages may use fetch/XHR and WS/WSS, and localhost means the player's PC). The
      // browser is the open question -- an https:// page may not open ws://, and although Chromium treats
      // 127.0.0.1 as potentially trustworthy, that carve-out has moved across releases.
      //
      // So the probe reports `origin` and `isSecureContext` alongside the verdict. Those two fields are worth
      // as much as the connection result: they say whether the bundled page is a secure origin at all, which
      // is what decides whether ws:// was ever going to be allowed.
      //
      // `error` gives a script no detail by design (cross-origin information leak), so a refusal and a policy
      // block look alike from here. That is why `elapsedMs` is reported and why the listener prints its own
      // side: a handshake the server SAW is unambiguous, and the two logs together tell the whole story.
      Open77.on("race:wsprobe", (req) => {
        const url = (req && req.url) || "ws://127.0.0.1:38480";
        const t0 = (performance && performance.now) ? performance.now() : Date.now();
        const env = {
          origin: (location && location.origin) || "(none)",
          secureContext: (typeof isSecureContext === "boolean") ? isSecureContext : "unknown",
          protocol: (location && location.protocol) || "(none)",
        };
        const report = (verdict, detail) => {
          const now = (performance && performance.now) ? performance.now() : Date.now();
          Open77.emit("race:wsprobe.result", Object.assign({
            verdict: verdict, detail: String(detail), elapsedMs: Math.round(now - t0),
          }, env));
        };
        // ROUND 2. The first probe answered the headline question -- `ws://` from this `https://` bundled page
        // failed in 0ms without the listener ever seeing a TCP connection, which is a policy refusal and not a
        // refused connect. What it did NOT answer is WHICH policy, and that decides what we build instead.
        //
        // So: try several schemes against a port where NOTHING is listening, and read the TIMING.
        //   * a scheme the browser refuses fails in ~0ms, before any socket is opened;
        //   * a scheme the browser permits reaches the network and fails on ECONNREFUSED, measurably later.
        // That single distinction separates "mixed content blocks ws://" from "loopback is unreachable at all",
        // and it needs no certificate and no change to the machine.
        const DEAD = (url.split(":")[2] || "38480").replace(/[^0-9]/g, "") === "38480" ? "38481" : "38481";
        const trials = [
          { name: "ws-live",     run: (done) => wsTrial(url, done) },
          { name: "ws-dead",     run: (done) => wsTrial("ws://127.0.0.1:" + DEAD, done) },
          { name: "wss-dead",    run: (done) => wsTrial("wss://127.0.0.1:" + DEAD, done) },
          { name: "fetch-http",  run: (done) => fetchTrial("http://127.0.0.1:" + DEAD + "/", done) },
          { name: "fetch-https", run: (done) => fetchTrial("https://127.0.0.1:" + DEAD + "/", done) },
        ];

        function wsTrial(u, done) {
          const s0 = now();
          let sock;
          try { sock = new WebSocket(u); }
          catch (e) { done("THREW", e && e.message ? e.message : String(e), now() - s0); return; }
          let settled = false;
          const finish = (v, d) => { if (!settled) { settled = true; try { sock.close(); } catch (e) {} done(v, d, now() - s0); } };
          const t = setTimeout(() => finish("TIMEOUT", "no result in 5s"), 5000);
          sock.onopen = () => { clearTimeout(t); finish("OPEN", "connected"); };
          sock.onerror = () => { clearTimeout(t); finish("ERROR", "failed"); };
        }

        function fetchTrial(u, done) {
          const s0 = now();
          let settled = false;
          const finish = (v, d) => { if (!settled) { settled = true; done(v, d, now() - s0); } };
          try {
            fetch(u, { mode: "cors", cache: "no-store" })
              .then((r) => finish("OK", "status " + r.status))
              .catch((e) => finish("ERROR", (e && e.message) ? e.message : String(e)));
            setTimeout(() => finish("TIMEOUT", "no result in 5s"), 5000);
          } catch (e) { finish("THREW", e && e.message ? e.message : String(e)); }
        }

        function now() { return (performance && performance.now) ? performance.now() : Date.now(); }

        // The live socket still gets its real attempt first, and still sends a frame if it opens.
        let ws;
        try { ws = new WebSocket(url); } catch (e) { /* recorded by the ws-live trial below */ }
        if (ws) {
          ws.onopen = () => {
            try {
              ws.send(JSON.stringify({ probe: "ncm", origin: env.origin,
                sample: { throttle: 0.5, brake: 0, steering: -0.25, rpm: 3200, rpmMax: 5300, gear: 3 } }));
            } catch (e) {}
            setTimeout(() => { try { ws.close(1000, "probe done"); } catch (e) {} }, 400);
          };
          ws.onerror = () => {};
        }

        const results = [];
        let i = 0;
        (function next() {
          if (i >= trials.length) {
            report("MATRIX", results.join("  |  "));
            return;
          }
          const trial = trials[i++];
          trial.run((verdict, detail, ms) => {
            results.push(trial.name + "=" + verdict + "/" + Math.round(ms) + "ms(" + detail + ")");
            next();
          });
        })();
      });

      // ---------------------------------------------------------------------------------------------
      // The guard this page has never had
      // ---------------------------------------------------------------------------------------------
      //
      // `panel.html` wraps every render in a `guard()` that catches, blanks cleanly and emits
      // `panel:error`, and `tools/panel-render-check.js` fires payloads at it. This page had NEITHER: a
      // throw anywhere inside `apply` vanished into CEF and took the whole race HUD with it -- lights,
      // strip, board, graph, odometer and inputs together -- with no log line anywhere.
      //
      // That is a worse failure than the one `KB-61` was written for, and it went unnoticed because the
      // race HUD never takes focus, so there was no soft-lock to make it obvious.
      // `tools/race-render-check.js` is the harness; this is the seam it needs.
      const guard = (what, fn) => {
        try {
          fn();
          Open77.emit("race:drawn", { view: what });
        } catch (e) {
          Open77.emit("race:error", {
            view: what,
            message: (e && e.message) ? String(e.message) : String(e),
            where: (e && e.stack) ? String(e.stack).split("\n")[1] || "" : "",
          });
        }
      };

      // The ghost row arrives on its own channel at 20 Hz, deliberately NOT inside `race:state` -- the delta
      // changes continuously and would defeat that payload's throttling. An absent or non-playing ghost shows
      // a dash rather than a stale number: a confidently wrong delta is worse than an absent one.
      const ghostEl = document.getElementById("ghost");
      const ghostLabel = document.getElementById("ghostLabel");
      const ghostWho = document.getElementById("ghostWho");
      const ghostTime = document.getElementById("ghostTime");
      const ghostDelta = document.getElementById("ghostDelta");
      const ghostWarn = document.getElementById("ghostWarn");

      const lapTime = (ms) => {
        if (typeof ms !== "number" || !(ms > 0)) return "--";
        const t = ms / 1000;
        const m = Math.floor(t / 60);
        const sec = t - m * 60;
        return m > 0 ? m + ":" + (sec < 10 ? "0" : "") + sec.toFixed(3) : sec.toFixed(3);
      };
      const deltaText = (ms) => {
        if (typeof ms !== "number") return "--";
        return (ms < 0 ? "-" : "+") + (Math.abs(ms) / 1000).toFixed(3);
      };

      const applyGhost = (g) => {
        if (!g || g.present !== true) {
          ghostEl.classList.add("hidden");
          return;
        }
        ghostEl.classList.remove("hidden");
        ghostLabel.textContent = g.label || "GHOST";
        ghostWho.textContent = g.display ? String(g.display) : "";
        ghostTime.textContent = lapTime(g.elapsedMs);
        const hasDelta = g.playing === true && typeof g.deltaMs === "number";
        ghostDelta.textContent = hasDelta ? "Δ " + deltaText(g.deltaMs) : "--";
        // classList, not `className =`: assigning the whole attribute would silently drop any class another
        // part of this page had put on the element, and it is the harder of the two to test.
        ghostDelta.classList.toggle("ahead", hasDelta && g.deltaMs < 0);
        ghostDelta.classList.toggle("behind", hasDelta && g.deltaMs >= 0);
        ghostDelta.classList.toggle("na", !hasDelta);
        // A ghost drawn from the fallback model is a MISSING TEMPLATE, not a missing feature. Say so on the
        // HUD rather than leaving a driver to wonder why their car is a road arrow.
        if (g.fallbackModel === true) {
          ghostWarn.textContent = "NO CAR MODEL";
          ghostWarn.classList.remove("hidden");
        } else {
          ghostWarn.classList.add("hidden");
        }
      };

      Open77.on("race:ghost", (g) => guard("ghost", () => applyGhost(g)));
      Open77.on("race:state", (s) => guard("state", () => apply(s)));
      Open77.ready();
      Open77.emit("race:ready", {});
    })();
  </script>
</body>
</html>
