<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>NCM Deep</title>
<style>
  /* KB-439: transparent until the first frame decides -- the native view (the default camera) shows the game through
     this page, so every white or black frame before that was a flash over the car */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: "Consolas", monospace; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #fade { position: fixed; inset: 0; background: #fff; opacity: 0; transition: opacity 1.4s ease-out; pointer-events: none; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>
<div id="fade"></div>
<script>
// NCM Deep (L326): the universe beyond Night City, drawn inside Cyberpunk. Lua owns the physics (core space.deep) and
// sends state ~30 Hz; this page only draws it.
//
// Ported understanding (OpenSpace, MIT): CAMERA-RELATIVE RENDERING. Positions live in double precision here (JS numbers,
// metres, Earth-centred); everything is shifted to the camera BEFORE it becomes float32 for the GPU, so a 5 m car and a
// 6,371 km Earth share one view without jitter. Earth is one depth-tested sphere with the near plane at a quarter of the camera's
// altitude, so one view spans metres to 400,000 km without depth trouble; the car is drawn in screen space with an
// analytic Earth-occlusion test. Earth imagery: NASA Blue Marble (public domain), fetched locally (web/deep/earth.jpg);
// without it the globe falls back to a flat ocean-and-land colour.
(function () {
  "use strict";
  var bridge = window.Open77 || null;
  // L332: no MSAA on the screen -- the world is drawn into its own target and reconstructed (EASU + RCAS)
  var gl = document.getElementById("gl").getContext("webgl", { antialias: false, alpha: true, premultipliedAlpha: true });
  var hudC = document.getElementById("hud"), hud = hudC.getContext("2d");
  var fade = document.getElementById("fade");
  var dpr = window.devicePixelRatio || 1;
  var W = 0, H = 0;
  function size() { W = Math.floor(innerWidth * dpr); H = Math.floor(innerHeight * dpr);
    gl.canvas.width = W; gl.canvas.height = H; hudC.width = W; hudC.height = H; }
  size(); addEventListener("resize", size);

  var R = 6371000, NC = { lat: 35.37, lon: -120.85 }, SUN = [1, 0, 0];
  var S = null, prev = null, prevAt = 0, at = 0;      // the last two states, for interpolation
  var earthTex = null, spriteImg = null, VENUES = [], ROUTE = null;
  // ASCENT (owner, 2026-10-06: "begin the Deep visual transition before 12,000 m"): the same page, transparent, over
  // REDengine while the car is still in Night City. It draws NCM's Earth only BEYOND the distance where REDengine's world
  // is still useful (no depth from the game reaches a WebUI layer, so the mask is distance from the camera), fading in
  // with altitude; at the seam the same page becomes Deep. The game camera is not exposed to scripts: the view is the
  // vehicle chase camera reconstructed from the car's own frame (an approximation, said so).
  var LAST_NATIVE = null;
  var MODE = "deep", AS = null, PROBE = false;

  // ---------------------------------------------------------------- vectors (double precision, plain arrays)
  function sub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
  function add(a, b) { return [a[0] + b[0], a[1] + b[1], a[2] + b[2]]; }
  function sc(a, k) { return [a[0] * k, a[1] * k, a[2] * k]; }
  function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
  function cross(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }
  function len(a) { return Math.sqrt(dot(a, a)); }

  function arr(v) { return Array.isArray(v) ? v : [v[1] || v.x || 0, v[2] || v.y || 0, v[3] || v.z || 0]; }
  function lla(lat, lon, alt) { var r = R + alt, la = lat * Math.PI / 180, lo = lon * Math.PI / 180;
    return [r * Math.cos(la) * Math.cos(lo), r * Math.cos(la) * Math.sin(lo), r * Math.sin(la)]; }

  // ---------------------------------------------------------------- GL
  function sh(type, src) { var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) emit("deep:error", { where: "shader", log: gl.getShaderInfoLog(s) }); return s; }
  function prog(vs, fs) { var p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p); return p; }
  function emit(k, v) { try { if (bridge && bridge.emit) bridge.emit(k, v); } catch (e) {} }


  // ---------------------------------------------------------------- L332: the WORLD layer
  // Owner brief (2026-10-06): "more actual geography underneath, fewer pixels spent rendering it, smarter reconstruction
  // on top, and never upscale the HUD." The pipeline:
  //   canonical Deep state (Lua) -> geographic LOD (core space.geolod: a clipmap of real imagery from the host bridge)
  //   -> the WORLD (sky, planet, the air's rim) drawn at an INTERNAL resolution into its own target, premultiplied, alpha
  //   = how much it hides what is behind -> spatial reconstruction to the display (EASU, then restrained RCAS: a GLSL ES
  //   port of AMD FidelityFX FSR 1, MIT licence, (c) Advanced Micro Devices) -> stars drawn NATIVELY under it -> the 2D
  //   HUD canvas (instruments, Guidance, markers, the Machine's sprite and locator) at native resolution, never scaled.
  // The planet is RAY-TRACED per pixel (camera-relative, the stable root c / (-b + sqrt(disc))), as AC's pass is: no
  // facets near the ground. Imagery comes from a clipmap: one 1024 px window per zoom 5..16 (atlas cells), sampled at the
  // finest zoom whose texels are no smaller than this pixel's ground footprint, in coordinates relative to the point
  // under the camera (so precision is centimetres, not float32 latitude). A tile not yet here shows its parent, and the
  // global image under everything: never a blank.
  // WorldFrame contract for a later TEMPORAL reconstructor (not built): it would also need depth, motion vectors, a
  // sub-pixel jitter and RS.reset (raised on a scale change, a camera mode change, the seam and any teleport).
  var QUAD = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, QUAD);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  var VS_Q = "attribute vec2 q; varying vec2 ndc; void main(){ ndc=q; gl_Position=vec4(q,0.0,1.0); }";

  var planetP = prog(VS_Q,
    "precision highp float; varying vec2 ndc;" +
    "uniform vec3 uCam; uniform float uC; uniform float uAlt; uniform float uR;" +
    "uniform vec3 uFwd; uniform vec3 uUp; uniform vec3 uSide; uniform float uTan; uniform float uAspect;" +
    "uniform vec3 uSun; uniform sampler2D uEarth; uniform float uHasTex;" +
    "uniform float uAscent; uniform float uK; uniform float uD0; uniform float uD1;" +
    "uniform sampler2D uAtlas; uniform float uGeo; uniform vec4 uLev[12]; uniform float uZFine;" +
    "uniform vec3 uE; uniform vec3 uN; uniform vec3 uU; uniform float uSubLat; uniform float uPixAng;" +
    "void main(){" +
    " vec3 d=normalize(uFwd+ndc.x*uTan*uAspect*uSide+ndc.y*uTan*uUp);" +
    " float b=dot(uCam,d); float disc=b*b-uC;" +
    " float airTop=clamp(1.0-uAlt/70000.0,0.0,1.0); float dayHere=clamp(dot(normalize(uCam),uSun)*3.0+0.4,0.0,1.0);" +
    " vec4 outc=uAscent>0.5?vec4(0.0):vec4(vec3(0.35,0.55,0.9)*airTop*dayHere,airTop*dayHere);" +
    " if(disc>0.0&&b<0.0){" +
    "  float t=uC/(-b+sqrt(disc)); vec3 hr=d*t; vec3 n=normalize(uCam+hr);" +
    "  vec2 uv=vec2(atan(n.y,n.x)/6.2831853+0.5,0.5-asin(clamp(n.z,-1.0,1.0))/3.1415927);" +
    "  vec3 col=uHasTex>0.5?texture2D(uEarth,uv).rgb:vec3(0.05,0.15,0.3);" +
    "  if(uGeo>0.5){" +
    "   vec3 ps=uU*uAlt+hr; float rr=uR+dot(ps,uU);" +
    "   float dlat=atan(dot(ps,uN),rr); float dlon=atan(dot(ps,uE),rr)/max(cos(uSubLat+dlat),0.01);" +
    "   float latD=degrees(dlat); float lonD=degrees(dlon);" +
    "   float inc=max(-dot(d,n),0.08); float zd=log2(78271.52*inc/max(t*uPixAng,0.01));" +
    "   for(int i=0;i<12;i++){" +
    "    float fi=float(i); if(fi>uZFine) break;" +
    "    vec4 L=uLev[i]; float z=fi+5.0; float wz=clamp(zd-z+1.0,0.0,1.0);" +
    "    if(L.z<0.5||wz<=0.0) continue;" +
    "    float span=180.0/exp2(z); float tu=L.x+lonD/span; float tv=L.y-latD/span;" +
    "    float edge=min(min(tu,4.0-tu),min(tv,4.0-tv)); if(edge<=0.0) continue;" +
    "    vec2 cell=vec2(mod(fi,4.0),floor(fi/4.0));" +
    "    vec2 a=(cell*1024.0+clamp(vec2(tu,tv)*256.0,0.5,1023.5))/vec2(4096.0,3072.0);" +
    "    col=mix(col,texture2D(uAtlas,a).rgb,wz*clamp(edge/0.35,0.0,1.0));" +
    "   }" +
    "  }" +
    "  float day=smoothstep(-0.08,0.25,dot(n,uSun)); vec3 lit=col*(0.03+0.97*day);" +
    "  lit=mix(lit,vec3(0.6,0.72,0.9)*(0.1+0.9*day),0.35*clamp(t/400000.0,0.0,1.0)*airTop);" +
    "  float a=uAscent>0.5?uK*smoothstep(uD0,uD1,t):1.0; outc=vec4(lit*a,a);" +
    " } else if(uAscent<0.5&&uAlt>2000.0&&b<0.0){" +
    "  float r=sqrt(max(dot(uCam,uCam)-b*b,0.0));" +
    "  if(r>uR){ float g=clamp(1.0-(r-uR)/(0.02*uR),0.0,1.0); g=g*g*g;" +
    "   float dl=smoothstep(-0.2,0.4,dot(normalize(uCam-d*b),uSun)); float ga=g*dl*0.85;" +
    "   outc=vec4(outc.rgb+vec3(0.35,0.6,1.0)*ga*(1.0-outc.a),max(outc.a,ga)); }" +
    " }" +
    " gl_FragColor=outc; }");

  // EASU: edge-adaptive spatial upsampling (12 taps, Lanczos-2 shaped along the local edge, clamped to its 2x2 so it
  // cannot ring). Input: the premultiplied world at its internal size; output: the display size.
  var easuP = prog(VS_Q,
    "precision highp float; uniform sampler2D uIn; uniform vec2 uInSize; uniform vec2 uOutSize;" +
    "vec4 T(vec2 p){ return texture2D(uIn,(p+0.5)/uInSize); }" +
    "float Lu(vec4 c){ return c.b*0.5+(c.r*0.5+c.g); }" +
    "void tap(inout vec4 aC,inout float aW,vec2 off,vec2 dir,vec2 len,float lob,float clp,vec4 c){" +
    " vec2 v=vec2(off.x*dir.x+off.y*dir.y,off.x*(-dir.y)+off.y*dir.x)*len; float d2=min(dot(v,v),clp);" +

    " lx=clamp(abs(dx)*lx,0.0,1.0); lx*=lx; len+=lx*w;" +
    " float ec=lE-lC; float ca=lC-lA; float ly=max(abs(ec),abs(ca)); ly=ly>0.0?1.0/ly:0.0; float dy=lE-lA; dir.y+=dy*w;" +
    " ly=clamp(abs(dy)*ly,0.0,1.0); ly*=ly; len+=ly*w; }" +
    "void main(){" +
    " vec2 pp=gl_FragCoord.xy*(uInSize/uOutSize)-0.5; vec2 fp=floor(pp); pp-=fp;" +
    " vec4 b=T(fp+vec2(0.0,-1.0)); vec4 c=T(fp+vec2(1.0,-1.0));" +
    " vec4 e=T(fp+vec2(-1.0,0.0)); vec4 f=T(fp); vec4 g=T(fp+vec2(1.0,0.0)); vec4 h=T(fp+vec2(2.0,0.0));" +
    " vec4 i=T(fp+vec2(-1.0,1.0)); vec4 j=T(fp+vec2(0.0,1.0)); vec4 k=T(fp+vec2(1.0,1.0)); vec4 l=T(fp+vec2(2.0,1.0));" +
    " vec4 n=T(fp+vec2(0.0,2.0)); vec4 o=T(fp+vec2(1.0,2.0));" +
    " float bL=Lu(b),cL=Lu(c),eL=Lu(e),fL=Lu(f),gL=Lu(g),hL=Lu(h),iL=Lu(i),jL=Lu(j),kL=Lu(k),lL=Lu(l),nL=Lu(n),oL=Lu(o);" +
    " vec2 dir=vec2(0.0); float len=0.0;" +
    " setDir(dir,len,(1.0-pp.x)*(1.0-pp.y),bL,eL,fL,gL,jL); setDir(dir,len,pp.x*(1.0-pp.y),cL,fL,gL,hL,kL);" +
    " setDir(dir,len,(1.0-pp.x)*pp.y,fL,iL,jL,kL,nL); setDir(dir,len,pp.x*pp.y,gL,jL,kL,lL,oL);" +
    " vec2 dir2=dir*dir; float dirR=dir2.x+dir2.y; bool zro=dirR<1.0/32768.0; dirR=zro?1.0:inversesqrt(dirR);" +
    " dir.x=zro?1.0:dir.x; dir*=dirR; len=len*0.5; len*=len;" +
    " float stretch=dot(dir,dir)/max(abs(dir.x),abs(dir.y)); vec2 len2=vec2(1.0+(stretch-1.0)*len,1.0-0.5*len);" +
    " float lob=0.5+((1.0/4.0-0.04)-0.5)*len; float clp=1.0/lob;" +
    " vec4 mn=min(min(f,g),min(j,k)); vec4 mx=max(max(f,g),max(j,k)); vec4 aC=vec4(0.0); float aW=0.0;" +
    " tap(aC,aW,vec2(0.0,-1.0)-pp,dir,len2,lob,clp,b); tap(aC,aW,vec2(1.0,-1.0)-pp,dir,len2,lob,clp,c);" +
    " tap(aC,aW,vec2(-1.0,1.0)-pp,dir,len2,lob,clp,i); tap(aC,aW,vec2(0.0,1.0)-pp,dir,len2,lob,clp,j);" +
    " tap(aC,aW,vec2(0.0,0.0)-pp,dir,len2,lob,clp,f); tap(aC,aW,vec2(-1.0,0.0)-pp,dir,len2,lob,clp,e);" +
    " tap(aC,aW,vec2(1.0,1.0)-pp,dir,len2,lob,clp,k); tap(aC,aW,vec2(2.0,1.0)-pp,dir,len2,lob,clp,l);" +
    " tap(aC,aW,vec2(2.0,0.0)-pp,dir,len2,lob,clp,h); tap(aC,aW,vec2(1.0,0.0)-pp,dir,len2,lob,clp,g);" +
    " tap(aC,aW,vec2(1.0,2.0)-pp,dir,len2,lob,clp,o); tap(aC,aW,vec2(0.0,2.0)-pp,dir,len2,lob,clp,n);" +
    " gl_FragColor=min(mx,max(mn,aC/aW)); }");

  // RCAS: robust contrast-adaptive sharpening, restrained (uSharp in stops: 0 = AMD's maximum; 0.5 here), limited by
  // the local min/max so it cannot overshoot; premultiplied colour stays valid.
  var rcasP = prog(VS_Q,
    "precision highp float; uniform sampler2D uIn; uniform vec2 uSize; uniform float uSharp;" +
    "vec4 T(vec2 p){ return texture2D(uIn,p/uSize); }" +
    "void main(){ vec2 p=gl_FragCoord.xy;" +
    " vec4 e=T(p); vec4 b=T(p+vec2(0.0,1.0)); vec4 d=T(p+vec2(-1.0,0.0)); vec4 f=T(p+vec2(1.0,0.0)); vec4 h=T(p+vec2(0.0,-1.0));" +
    " vec3 mn4=min(min(b.rgb,d.rgb),min(f.rgb,h.rgb)); vec3 mx4=max(max(b.rgb,d.rgb),max(f.rgb,h.rgb));" +
    " vec3 hitMin=mn4/(4.0*mx4+1e-5); vec3 hitMax=(1.0-mx4)/(4.0*mn4-4.0-1e-5); vec3 lobeRGB=max(-hitMin,hitMax);" +
    " float lobe=max(-0.1875,min(max(lobeRGB.r,max(lobeRGB.g,lobeRGB.b)),0.0))*exp2(-uSharp);" +
    " vec4 c=(lobe*(b+d+f+h)+e)/(4.0*lobe+1.0); c=clamp(c,0.0,1.0); c.rgb=min(c.rgb,vec3(c.a)); gl_FragColor=c; }");

  // ---- render targets and the internal scale (dynamic, explicit: 100 / 77 / 67 / 59 / 50 %)
  var RS = { steps: [1, 0.77, 0.67, 0.59, 0.5], i: 1, world: null, out: null, ok: true, frameMs: 16.7, lastT: 0,
    slowSince: 0, fastSince: 0, changedAt: 0, reset: true, probed: false, sharp: 0.5, fov: 1.0 };
  function makeTarget(w, h) {
    var t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

  })();
  function span(z) { return 180 / Math.pow(2, z); }
