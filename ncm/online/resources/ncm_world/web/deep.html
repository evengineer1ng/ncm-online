<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>NCM Deep</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: "Consolas", monospace; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #fade { position: fixed; inset: 0; background: #fff; opacity: 1; transition: opacity 1.4s ease-out; pointer-events: none; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>
<div id="fade"></div>
<script>
// NCM Deep (L326): the universe beyond Night City, drawn inside Cyberpunk. Lua owns the physics (core space.deep) and
// sends state ~30 Hz; this page only draws it.
//
// Ported understanding (OpenSpace, MIT): CAMERA-RELATIVE RENDERING. Positions live in double precision here (JS numbers,
// metres, Earth-centred); everything is shifted to the camera BEFORE it becomes float32 for the GPU, so a 5 m car and a
// 6,371 km Earth share one view without jitter. Earth is one depth-tested sphere with the near plane at a quarter of the camera's
// altitude, so one view spans metres to 400,000 km without depth trouble; the car is drawn in screen space with an
// analytic Earth-occlusion test. Earth imagery: NASA Blue Marble (public domain), fetched locally (web/deep/earth.jpg);
// without it the globe falls back to a flat ocean-and-land colour.
(function () {
  "use strict";
  var bridge = window.Open77 || null;
  var gl = document.getElementById("gl").getContext("webgl", { antialias: true });
  var hudC = document.getElementById("hud"), hud = hudC.getContext("2d");
  var fade = document.getElementById("fade");
  var dpr = window.devicePixelRatio || 1;
  var W = 0, H = 0;
  function size() { W = Math.floor(innerWidth * dpr); H = Math.floor(innerHeight * dpr);
    gl.canvas.width = W; gl.canvas.height = H; hudC.width = W; hudC.height = H; }
  size(); addEventListener("resize", size);

  var R = 6371000, NC = { lat: 35.37, lon: -120.85 }, SUN = [1, 0, 0];
  var S = null, prev = null, prevAt = 0, at = 0;      // the last two states, for interpolation
  var earthTex = null, spriteImg = null, VENUES = [], ROUTE = null;
  // ASCENT (owner, 2026-10-06: "begin the Deep visual transition before 12,000 m"): the same page, transparent, over
  // REDengine while the car is still in Night City. It draws NCM's Earth only BEYOND the distance where REDengine's world
  // is still useful (no depth from the game reaches a WebUI layer, so the mask is distance from the camera), fading in
  // with altitude; at the seam the same page becomes Deep. The game camera is not exposed to scripts: the view is the
  // vehicle chase camera reconstructed from the car's own frame (an approximation, said so).
  var MODE = "deep", AS = null;

  // ---------------------------------------------------------------- vectors (double precision, plain arrays)
  function sub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
  function add(a, b) { return [a[0] + b[0], a[1] + b[1], a[2] + b[2]]; }
  function sc(a, k) { return [a[0] * k, a[1] * k, a[2] * k]; }
  function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
  function cross(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }
  function len(a) { return Math.sqrt(dot(a, a)); }
  function unit(a) { var l = len(a); return l > 0 ? sc(a, 1 / l) : [0, 0, 1]; }
  function lerp(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
  function arr(v) { return Array.isArray(v) ? v : [v[1] || v.x || 0, v[2] || v.y || 0, v[3] || v.z || 0]; }
  function lla(lat, lon, alt) { var r = R + alt, la = lat * Math.PI / 180, lo = lon * Math.PI / 180;
    return [r * Math.cos(la) * Math.cos(lo), r * Math.cos(la) * Math.sin(lo), r * Math.sin(la)]; }

  // ---------------------------------------------------------------- GL
  function sh(type, src) { var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) emit("deep:error", { where: "shader", log: gl.getShaderInfoLog(s) }); return s; }
  function prog(vs, fs) { var p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p); return p; }
  function emit(k, v) { try { if (bridge && bridge.emit) bridge.emit(k, v); } catch (e) {} }

  // unit sphere, z = north pole (the same axes as core space.deep)
  var verts = [], idx = [], LAT = 128, LON = 256;
  for (var i = 0; i <= LAT; i++) { var la = Math.PI / 2 - i * Math.PI / LAT;
    for (var j = 0; j <= LON; j++) { var lo = -Math.PI + j * 2 * Math.PI / LON;
      verts.push(Math.cos(la) * Math.cos(lo), Math.cos(la) * Math.sin(lo), Math.sin(la)); } }
  for (i = 0; i < LAT; i++) for (j = 0; j < LON; j++) { var a = i * (LON + 1) + j, b = a + LON + 1; idx.push(a, a + 1, b, b, a + 1, b + 1); }
  var vb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vb); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(verts), gl.STATIC_DRAW);
  var ext32 = gl.getExtension("OES_element_index_uint");
  var ib = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, ext32 ? new Uint32Array(idx) : new Uint16Array(idx), gl.STATIC_DRAW);
  var IDXTYPE = ext32 ? gl.UNSIGNED_INT : gl.UNSIGNED_SHORT;

  var earthP = prog(
    "attribute vec3 p; uniform mat4 mvp; varying vec3 n; void main(){ n=p; gl_Position=mvp*vec4(p,1.0); }",
    "precision highp float; varying vec3 n; uniform vec3 sun; uniform vec3 eye; uniform sampler2D tex; uniform float hasTex;" +
    "void main(){ vec3 N=normalize(n); float lat=asin(clamp(N.z,-1.0,1.0)); float lon=atan(N.y,N.x);" +
    " vec2 uv=vec2(lon/6.2831853+0.5, 0.5-lat/3.1415927);" +
    " vec3 col = hasTex>0.5 ? texture2D(tex,uv).rgb : mix(vec3(0.03,0.12,0.32),vec3(0.25,0.35,0.15),step(0.55,fract(sin(dot(floor(uv*64.0),vec2(12.9898,78.233)))*43758.5)));" +
    " float d=dot(N,normalize(sun)); float day=smoothstep(-0.08,0.25,d);" +
    " vec3 V=normalize(eye-N); float rim=pow(1.0-max(dot(N,V),0.0),4.0);" +
    " vec3 lit=col*(0.03+0.97*day)+vec3(0.30,0.55,1.0)*rim*(0.15+0.85*day);" +
    " gl_FragColor=vec4(lit,1.0); }");
  var haloP = prog(
    "attribute vec3 p; uniform mat4 mvp; varying vec3 n; void main(){ n=p; gl_Position=mvp*vec4(p*1.018,1.0); }",
    "precision highp float; varying vec3 n; uniform vec3 eye; uniform vec3 sun;" +
    "void main(){ vec3 N=normalize(n); vec3 V=normalize(eye-N*1.018); float g=pow(1.0-abs(dot(N,V)),5.0);" +
    " float day=smoothstep(-0.2,0.4,dot(N,normalize(sun))); gl_FragColor=vec4(vec3(0.35,0.6,1.0)*g*day, g*day*0.85); }");
  // the Earth for the ascent: premultiplied alpha = altitude ramp x distance mask (near = REDengine's, far = NCM's)
  var earthAscP = prog(
    "attribute vec3 p; uniform mat4 mvp; uniform vec3 centre; uniform float rr; varying vec3 n; varying vec3 rel;" +
    " void main(){ n=p; rel=centre+p*rr; gl_Position=mvp*vec4(p,1.0); }",
    "precision highp float; varying vec3 n; varying vec3 rel; uniform vec3 sun; uniform sampler2D tex; uniform float hasTex;" +
    " uniform float k; uniform float d0; uniform float d1;" +
    "void main(){ vec3 N=normalize(n); float lat=asin(clamp(N.z,-1.0,1.0)); float lon=atan(N.y,N.x);" +
    " vec2 uv=vec2(lon/6.2831853+0.5, 0.5-lat/3.1415927);" +
    " vec3 col = hasTex>0.5 ? texture2D(tex,uv).rgb : vec3(0.1,0.2,0.3);" +
    " float day=smoothstep(-0.08,0.25,dot(N,normalize(sun)));" +
    " float dist=length(rel); float far=smoothstep(d0,d1,dist); float haze=smoothstep(d0,d1*6.0,dist);" +
    " vec3 lit=mix(col*(0.03+0.97*day), vec3(0.62,0.74,0.9)*(0.1+0.9*day), 0.35*haze);" +
    " float a=k*far; gl_FragColor=vec4(lit*a,a); }");
  var starP = prog(
    "attribute vec3 p; attribute float b; uniform mat4 vp; uniform float vis; varying float vb; void main(){ vb=b*vis; gl_Position=vp*vec4(p,1.0); gl_PointSize=1.0+2.0*b; }",
    "precision mediump float; varying float vb; void main(){ gl_FragColor=vec4(vec3(0.75+0.25*vb),vb); }");
  var stars = []; for (i = 0; i < 9000; i++) { var u = Math.random() * 2 - 1, w = Math.random() * 2 * Math.PI, rr = Math.sqrt(1 - u * u);
    stars.push(rr * Math.cos(w) * 100, rr * Math.sin(w) * 100, u * 100, 0.15 + 0.85 * Math.pow(Math.random(), 5)); }
  var sb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, sb); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(stars), gl.STATIC_DRAW);

  // ---------------------------------------------------------------- matrices (column-major)
  function persp(fov, aspect, n, f) { var t = 1 / Math.tan(fov / 2); return [t / aspect,0,0,0, 0,t,0,0, 0,0,(f + n) / (n - f),-1, 0,0,2 * f * n / (n - f),0]; }
  function mul(a, b) { var o = new Array(16); for (var r = 0; r < 4; r++) for (var c = 0; c < 4; c++) { var s = 0; for (var k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k]; o[c * 4 + r] = s; } return o; }
  // view rotation only (camera at the origin: camera-relative)
  function viewRot(fwd, up) { var f = unit(fwd), s = unit(cross(f, up)), u = cross(s, f);
    return [s[0],u[0],-f[0],0, s[1],u[1],-f[1],0, s[2],u[2],-f[2],0, 0,0,0,1]; }
  function model(t, k) { return [k,0,0,0, 0,k,0,0, 0,0,k,0, t[0],t[1],t[2],1]; }
  function project(VP, rel) { var x = VP[0] * rel[0] + VP[4] * rel[1] + VP[8] * rel[2] + VP[12], y = VP[1] * rel[0] + VP[5] * rel[1] + VP[9] * rel[2] + VP[13],
    w = VP[3] * rel[0] + VP[7] * rel[1] + VP[11] * rel[2] + VP[15]; if (w <= 0) return null; return [(x / w * 0.5 + 0.5) * W, (0.5 - y / w * 0.5) * H, w]; }
  // is the segment camera -> point blocked by the Earth? (ray-sphere, camera-relative)
  function hidden(cam, point) { var d = sub(point, cam), L = len(d); if (L <= 0) return false; d = sc(d, 1 / L);
    var b = dot(cam, d), c = dot(cam, cam) - R * R * 0.9999, disc = b * b - c; if (disc < 0) return false;
    var t = -b - Math.sqrt(disc); return t > 0 && t < L; }

  // ---------------------------------------------------------------- bridge
  if (bridge && bridge.on) {
    bridge.on("deep:init", function (m) {
      if (m.ascent) { MODE = "ascent"; fade.style.transition = "none"; fade.style.opacity = 0;
        document.documentElement.style.background = "transparent"; document.body.style.background = "transparent"; }
      if (m.nc) NC = m.nc; if (m.R) R = m.R; if (m.sun) SUN = arr(m.sun); if (m.venues) VENUES = m.venues;
      var e = new Image(); e.onload = function () { earthTex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, earthTex);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, e);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); };
      e.onerror = function () { emit("deep:error", { where: "earth texture missing", log: m.earth }); };
      e.src = m.earth;
      spriteImg = new Image(); spriteImg.src = m.sprite;
      if (!m.ascent) setTimeout(function () { fade.style.opacity = 0; }, 150);
    });
    bridge.on("deep:state", function (m) {
      if (m.sun) SUN = arr(m.sun);   // the real sun on NCM's clock
      var st = { p: arr(m.p), v: arr(m.v), r: arr(m.r), f: arr(m.f), u: arr(m.u), m: m };
      prev = S; prevAt = at; S = st; at = performance.now();
    });
    bridge.on("deep:route", function (m) { ROUTE = (m && m.points) || null; });
    bridge.on("deep:ascent", function (m) { if (m.sun) SUN = arr(m.sun); AS = { p: arr(m.p), f: arr(m.f), u: arr(m.u), k: Number(m.k) || 0, alt: Number(m.alt) || 0,
      toSeam: Number(m.toSeam) || 0, d0: Number(m.d0) || 9000, d1: Number(m.d1) || 16000 }; });
    // the seam: the ascent page becomes Deep (opaque from here; no white-out, the planet is already there)
    bridge.on("deep:mode", function (m) { MODE = (m && m.mode) || "deep";
      if (MODE === "deep") { document.documentElement.style.background = "#000"; document.body.style.background = "#000"; } });
    bridge.on("deep:leave", function () { fade.style.transition = "opacity 1.2s ease-in"; fade.style.opacity = 1; });
    if (bridge.ready) bridge.ready();
  }
  emit("deep:ready", {});

  // ---------------------------------------------------------------- frame
  function frame(now) {
    requestAnimationFrame(frame);
    gl.viewport(0, 0, W, H);
    if (MODE === "ascent") { drawAscent(now); return; }
    if (!S) { gl.clearColor(1, 1, 1, 1); gl.clear(gl.COLOR_BUFFER_BIT); return; }
    // interpolate between the last two Lua states (~33 ms apart) for smooth motion at 60 fps
    var k = prev ? Math.min(1.5, (now - at) / Math.max(1, at - prevAt)) : 0;
    var car = prev ? lerp(S.p, add(S.p, sub(S.p, prev.p)), Math.max(0, Math.min(1, k)) ) : S.p;
    var m = S.m, upL = unit(car), alt = len(car) - R;
    // camera
    var cam, look, camUp = upL, fwdH = unit(sub(S.f, sc(upL, dot(S.f, upL))));
    if (len(sub(S.f, sc(upL, dot(S.f, upL)))) < 1e-3) fwdH = unit(cross(upL, [0, 0, 1]));
    var G = m.guidance || {};
    if (G.open && G.cam) { cam = lla(G.cam.lat, G.cam.lon, G.cam.alt); look = sub([0, 0, 0], cam); camUp = unit(sub(lla(G.cam.lat + 1, G.cam.lon, 0), lla(G.cam.lat, G.cam.lon, 0))); }
    else if (m.cam === "earth") { cam = add(car, sc(upL, Math.max(3 * alt, 1.5e6))); look = sub([0, 0, 0], cam); camUp = unit(cross(cross(upL, [0, 0, 1]), upL)); }
    else if (m.cam === "high") { var d = 60 + alt * 0.6; cam = add(add(car, sc(fwdH, -d)), sc(upL, d * 0.6)); look = sub(car, cam); }
    else {
      // the chase camera ZOOMS (right stick up/down, I/O): 8 m to 40,000 km behind and above the Machine. Close, it looks
      // ahead of the car; far, it looks at it -- the same Earth, the same car, at its real size.
      var zd = Math.max(8, Math.min(4e7, Number(m.zoom) || 22));
      cam = add(add(car, sc(S.f, -zd)), sc(S.u, zd * 0.27));
      var aheadW = Math.max(0, 1 - (zd - 22) / 200);
      look = sub(add(car, sc(S.f, 30 * aheadW)), cam); camUp = S.u;
    }
    var V = viewRot(look, camUp);
    var camAlt = len(cam) - R;
    var near = Math.max(0.5, Math.min(camAlt * 0.25, 5e5)), far = 5e9;
    var P = persp(1.0, W / H, near, far), VP = mul(P, V);
    // sky: blue near the ground, black above the air (the "earthy" end of the blend)
    var air = Math.max(0, Math.min(1, 1 - (camAlt - 8000) / 70000));
    var dayHere = Math.max(0, Math.min(1, dot(unit(cam), unit(SUN)) * 3 + 0.4));
    gl.clearColor(0.35 * air * dayHere, 0.55 * air * dayHere, 0.9 * air * dayHere, 1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.disable(gl.DEPTH_TEST);
    // stars (rotation only), invisible in a bright sky
    gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
    gl.useProgram(starP); gl.uniformMatrix4fv(gl.getUniformLocation(starP, "vp"), false, mul(persp(1.0, W / H, 0.1, 1000), V));
    gl.uniform1f(gl.getUniformLocation(starP, "vis"), 1 - air * dayHere);
    gl.bindBuffer(gl.ARRAY_BUFFER, sb);
    var lp = gl.getAttribLocation(starP, "p"), lb = gl.getAttribLocation(starP, "b");
    gl.enableVertexAttribArray(lp); gl.vertexAttribPointer(lp, 3, gl.FLOAT, false, 16, 0);
    gl.enableVertexAttribArray(lb); gl.vertexAttribPointer(lb, 1, gl.FLOAT, false, 16, 12);
    gl.drawArrays(gl.POINTS, 0, 9000); gl.disableVertexAttribArray(lb); gl.disable(gl.BLEND);
    // Earth, camera-relative: centre at -cam, scale R
    var M = model(sc(cam, -1), R), MVP = mul(VP, M), eyeUnit = sc(cam, 1 / R);
    // one sphere, depth-tested (near = camAlt/4, so 24 bits separate its two hemispheres at any range): no winding to get wrong
    gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL); gl.depthMask(true);
    gl.useProgram(earthP); gl.uniformMatrix4fv(gl.getUniformLocation(earthP, "mvp"), false, MVP);
    gl.uniform3fv(gl.getUniformLocation(earthP, "sun"), SUN); gl.uniform3fv(gl.getUniformLocation(earthP, "eye"), eyeUnit);
    gl.uniform1f(gl.getUniformLocation(earthP, "hasTex"), earthTex ? 1 : 0);
    if (earthTex) { gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, earthTex); gl.uniform1i(gl.getUniformLocation(earthP, "tex"), 0); }
    gl.bindBuffer(gl.ARRAY_BUFFER, vb); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib);
    var ep = gl.getAttribLocation(earthP, "p"); gl.enableVertexAttribArray(ep); gl.vertexAttribPointer(ep, 3, gl.FLOAT, false, 0, 0);
    gl.drawElements(gl.TRIANGLES, idx.length, IDXTYPE, 0);
    if (camAlt > 2000) {   // the air as a halo seen from outside
      gl.depthMask(false); gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
      gl.useProgram(haloP); gl.uniformMatrix4fv(gl.getUniformLocation(haloP, "mvp"), false, MVP);
      gl.uniform3fv(gl.getUniformLocation(haloP, "eye"), eyeUnit); gl.uniform3fv(gl.getUniformLocation(haloP, "sun"), SUN);
      var hp = gl.getAttribLocation(haloP, "p"); gl.enableVertexAttribArray(hp); gl.vertexAttribPointer(hp, 3, gl.FLOAT, false, 0, 0);
      gl.drawElements(gl.TRIANGLES, idx.length, IDXTYPE, 0); gl.disable(gl.BLEND);
    }
    gl.depthMask(true); gl.disable(gl.DEPTH_TEST);

    // ------------------------------------------------ 2D: markers, the Machine, the HUD
    hud.clearRect(0, 0, W, H);
    var px = dpr;
    function marker(pos, label, color, pulse) {
      if (hidden(cam, pos)) return;
      var s = project(VP, sub(pos, cam)); if (!s) return;
      var r0 = (6 + (pulse ? 4 * Math.sin(now / 250) : 0)) * px;
      hud.strokeStyle = color; hud.lineWidth = 2 * px; hud.beginPath(); hud.arc(s[0], s[1], Math.max(3 * px, r0), 0, 6.283); hud.stroke();
      hud.fillStyle = color; hud.font = (13 * px) + "px Consolas, monospace"; hud.fillText(label, s[0] + 12 * px, s[1] - 8 * px);
    }
    marker(lla(NC.lat, NC.lon, 0), "NIGHT CITY", "#ff3df5", true);
    if (m.land) marker(lla(m.land[0], m.land[1], 0), "LANDING", "#ffd84a", false);
    for (var vi = 0; vi < VENUES.length; vi++) {
      var ve = VENUES[vi], selected = G.sel === vi + 1;
      if (G.open || selected && G.engaged) marker(lla(ve.lat, ve.lon, 0), (selected ? "> " : "") + ve.name, selected ? "#7dff7d" : "rgba(200,255,200,0.75)", selected);
    }
    if (ROUTE && G.engaged) {
      hud.strokeStyle = "rgba(125,255,125,0.6)"; hud.lineWidth = 2 * px; hud.beginPath(); var started = false;
      for (var ri = 0; ri < ROUTE.length; ri++) {
        var rp = lla(ROUTE[ri][0], ROUTE[ri][1], 0); if (hidden(cam, rp)) { started = false; continue; }
        var rs = project(VP, sub(rp, cam)); if (!rs) { started = false; continue; }
        if (!started) { hud.moveTo(rs[0], rs[1]); started = true; } else hud.lineTo(rs[0], rs[1]);
      }
      hud.stroke();
    }
    // the Machine, at its REAL size (owner, 2026-10-06: "that tiny thing is my car, and that is the Earth"). The sprite is
    // the car: canonical length HELLA_M projected through the camera, no minimum -- far away it is a fading dot, then
    // nothing. The LOCATOR is UI, not the car: a bracket with a minimum size so you can always find yourself; its scale
    // is a viewing preference (LOCATOR_SCALE) and never the Machine's size.
    var HELLA_M = 4.9, LOCATOR_SCALE = 1.0;
    if (!hidden(cam, car)) {
      var s2 = project(VP, sub(car, cam));
      if (s2) {
        var pxPerM = (H / 2) / Math.tan(0.5) / s2[2], wpx = HELLA_M * pxPerM;
        if (spriteImg && spriteImg.complete && spriteImg.naturalWidth > 0 && wpx >= 2 * px) {
          var draw = Math.min(W * 0.6, wpx), hpx = draw * spriteImg.naturalHeight / spriteImg.naturalWidth;
          var ahead = project(VP, sub(add(car, sc(S.f, 5)), cam)), flip = ahead && ahead[0] < s2[0];
          hud.save(); hud.globalAlpha = Math.min(1, (wpx / px - 2) / 6); hud.translate(s2[0], s2[1]); if (flip) hud.scale(-1, 1);
          hud.drawImage(spriteImg, -draw / 2, -hpx / 2, draw, hpx); hud.restore();
        } else if (wpx > 0.05 * px) {
          // smaller than a pixel: the car is a speck whose brightness is the share of the pixel it covers
          hud.fillStyle = "rgba(255,255,255," + Math.min(1, wpx / (2 * px)).toFixed(3) + ")"; hud.fillRect(s2[0] - px / 2, s2[1] - px / 2, px, px);
        }
        if (wpx < 40 * px) {   // too small to read as a car: the locator takes over (UI)
          var b = 11 * px * LOCATOR_SCALE, t = 4 * px * LOCATOR_SCALE, la = Math.min(1, (40 * px - wpx) / (20 * px));

        gl2.push("DIST    " + nz(G.engaged ? G.km : G.selKm).toFixed(0) + " km" + (G.engaged ? "   ETA " + Math.floor(nz(G.eta) / 60) + " min " + Math.floor(nz(G.eta) % 60) + " s" : ""));

  function drawAscent(now) {
